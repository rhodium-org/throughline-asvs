title: A code based out-of-band authentication mechanism is protected against brute
  force attacks by using rate limiting
text: Verify that a code based out-of-band authentication mechanism is protected
  against brute force attacks by using rate limiting. Consider also using a code
  with at least 64 bits of entropy.
